spring.application.name=DayFlow

# Railway / Docker set PORT; default 8080 for local
server.port=${PORT:8080}

# MySQL (overridden by Docker / Railway env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dayflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yourpassword}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# JWT
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-must-be-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Comma-separated origins, e.g. https://frontend.up.railway.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}